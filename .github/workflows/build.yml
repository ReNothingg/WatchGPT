name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: watchOS Simulator
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode version
        run: xcodebuild -version

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project WatchGPT.xcodeproj \
            -scheme WatchGPT \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Check bundled secrets
        run: |
          python3 - <<'PY'
          import pathlib
          import plistlib
          import sys

          roots = list(pathlib.Path("build/Build/Products").rglob("Info.plist"))
          if not roots:
              sys.exit("No built Info.plist files found")
          forbidden = {"OpenAIAPIKey", "AnthropicAPIKey"}
          for path in roots:
              try:
                  with path.open("rb") as f:
                      data = plistlib.load(f)
              except (ValueError, OSError, plistlib.InvalidFileException):
                  continue
              present = forbidden.intersection(data)
              if present:
                  sys.exit(f"Forbidden bundled API key fields in {path}: {sorted(present)}")
          print(f"Checked {len(roots)} built Info.plist files")
          PY

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
