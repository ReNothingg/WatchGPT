# Xcode project definition. The generated WatchGPT.xcodeproj is committed,
# so you only need XcodeGen (`brew install xcodegen`) if you change this file:
#   xcodegen generate
name: WatchGPT
options:
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: ru
  xcodeVersion: "16.0"

settings:
  base:
    # ⬇️ Change to something unique, e.g. com.yourname.watchgpt
    BUNDLE_ID_BASE: com.example.watchgpt
    APP_GROUP: group.$(BUNDLE_ID_BASE)
    # ⬇️ Or just pick your team in Xcode → Signing & Capabilities
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES

targets:
  WatchGPT:
    type: application
    platform: watchOS
    sources:
      - path: WatchGPT
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).watchkitapp
        PRODUCT_NAME: WatchGPT
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: NO
    info:
      path: WatchGPT/Info.plist
      properties:
        CFBundleDisplayName: WatchGPT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        AppGroupID: $(APP_GROUP)
        NSMicrophoneUsageDescription: Микрофон нужен, чтобы вы могли задавать вопросы голосом.
        WKBackgroundModes: [audio]
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [watchgpt]
    entitlements:
      path: WatchGPT/WatchGPT.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)
    dependencies:
      - target: WatchGPTWidget
        embed: true

  WatchGPTWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: WatchGPTWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).watchkitapp.widget
        PRODUCT_NAME: WatchGPTWidget
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: WatchGPTWidget/Info.plist
      properties:
        CFBundleDisplayName: WatchGPT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppGroupID: $(APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: WatchGPTWidget/WatchGPTWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP)

schemes:
  WatchGPT:
    build:
      targets:
        WatchGPT: all
    run:
      config: Debug
    archive:
      config: Release
